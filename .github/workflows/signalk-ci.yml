# Calls the canonical Signal K plugin CI workflow, which builds and tests the
# plugin on Linux x64, Linux arm64, macOS and Windows (Node 22 and 24).
#
# Running it is also what earns the registry's `plugin-ci` badge, and the
# build/test commands declared below are read by the plugin registry's scoring
# harness so it runs this plugin's real suite instead of guessing at one. They
# must be `npm run <script>` invocations for the harness to accept them.

name: SignalK Plugin CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:
    inputs:
      node-versions:
        description: 'JSON array of Node versions, example: ["22","24"]'
        required: false
        default: '["22", "24"]'
        type: string
      enable-armv7:
        description: Run armv7 (Cerbo GX) tests via QEMU
        required: false
        default: false
        type: boolean
      enable-signalk-integration:
        description: Start SignalK server and install plugin for integration testing
        required: false
        default: false
        type: boolean
      signalk-server-versions:
        description: 'JSON array of signalk-server versions, e.g. ["2.23.0","latest"]'
        required: false
        default: '["latest"]'
        type: string

jobs:
  # Automatic runs on push / pull request.
  test-plugin-auto:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    uses: SignalK/signalk-server/.github/workflows/plugin-ci.yml@master
    with:
      build-command: npm run build
      test-command: npm run test
      node-versions: '["22", "24"]'
      # armv7/Cerbo GX emulation is deliberately off: it runs Node 20 under
      # QEMU, and `npm test` invokes `node --test test/**/*.js`, whose glob is
      # expanded by the test runner itself and needs Node 21 or later.
      enable-armv7: false
      enable-signalk-integration: false

  # Manual runs, so armv7 and the integration test can be switched on per-run
  # from the Actions UI without editing this file.
  test-plugin-manual:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: SignalK/signalk-server/.github/workflows/plugin-ci.yml@master
    with:
      build-command: npm run build
      test-command: npm run test
      node-versions: ${{ inputs.node-versions }}
      enable-armv7: ${{ inputs.enable-armv7 }}
      enable-signalk-integration: ${{ inputs.enable-signalk-integration }}
      signalk-server-versions: ${{ inputs.signalk-server-versions }}
