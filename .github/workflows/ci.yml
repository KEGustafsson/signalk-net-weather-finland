# Static checks and dependency auditing.
#
# Building and testing the plugin is handled by signalk-ci.yml, which runs the
# canonical Signal K plugin CI across Linux x64, Linux arm64, macOS and Windows.
# This workflow covers only what that one doesn't: linting, type-checking and
# `npm audit`.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so `npm audit` is re-run against newly published advisories
    # even when nothing is pushed.
    - cron: '0 5 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          # No package-lock.json is committed, so neither `npm ci` nor
          # setup-node's built-in npm cache can be used here.

      - run: npm install

      # ESLint over test/, then `tsc --noEmit` over src/.
      - run: npm run lint

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'

      # `npm audit` needs a lockfile; install generates one.
      - run: npm install

      - run: npm run audit-check
